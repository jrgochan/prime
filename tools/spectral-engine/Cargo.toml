[package]
name = "core-engine"
version = "0.1.0"
edition = "2021"
autobins = false

[lib]
name = "core_engine"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "g2_spectral"
path = "src/bin/g2_spectral.rs"

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
ndarray = "0.15.6"

# Monte Carlo PRNG modules specifically patched for WebAssembly JS context execution
getrandom = { version = "0.2", features = ["js"] }
rand = "0.8"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
pyo3 = { version = "0.20.0", features = ["extension-module"] }

[target.'cfg(target_os = "macos")'.dependencies]
accelerate-src = "0.3.2"
