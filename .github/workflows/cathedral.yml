name: Cathedral Verification

on:
  push:
    branches: [ main ]
    paths:
      - 'proofs/**'
      - '.github/workflows/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'proofs/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Cathedral
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: proofs

    steps:
      - uses: actions/checkout@v7

      - name: Install elan
        uses: leanprover/lean-action@v1
        with:
          build: false
          lake-package-directory: proofs

      - name: Cache Lake packages
        uses: actions/cache@v5
        with:
          path: |
            proofs/.lake/packages
            proofs/.lake/build
          key: lake-${{ hashFiles('proofs/lean-toolchain') }}-${{ hashFiles('proofs/lakefile.lean') }}-${{ hashFiles('proofs/lake-manifest.json') }}
          restore-keys: |
            lake-${{ hashFiles('proofs/lean-toolchain') }}-${{ hashFiles('proofs/lakefile.lean') }}-
            lake-${{ hashFiles('proofs/lean-toolchain') }}-

      - name: Build Cathedral
        run: lake build

  verify-challenge:
    name: Verify Challenge/Solution
    runs-on: ubuntu-latest
    timeout-minutes: 120
    needs: build
    defaults:
      run:
        working-directory: proofs

    steps:
      - uses: actions/checkout@v7

      - name: Install elan
        uses: leanprover/lean-action@v1
        with:
          build: false
          lake-package-directory: proofs

      - name: Cache Lake packages
        uses: actions/cache@v5
        with:
          path: |
            proofs/.lake/packages
            proofs/.lake/build
          key: lake-${{ hashFiles('proofs/lean-toolchain') }}-${{ hashFiles('proofs/lakefile.lean') }}-${{ hashFiles('proofs/lake-manifest.json') }}
          restore-keys: |
            lake-${{ hashFiles('proofs/lean-toolchain') }}-${{ hashFiles('proofs/lakefile.lean') }}-
            lake-${{ hashFiles('proofs/lean-toolchain') }}-

      - name: Verify Challenge.lean (Mathlib only)
        run: |
          echo "=== Challenge.lean: should compile with only Mathlib imports ==="
          echo "=== Expected: 1 sorry warning (the claim to be proved) ==="
          lake build Challenge 2>&1 | tee /tmp/challenge_output.txt
          grep -q "declaration uses.*sorry" /tmp/challenge_output.txt
          echo "✅ Challenge.lean compiles with expected sorry"

      - name: Verify Solution.lean (Cathedral proof)
        run: |
          echo "=== Solution.lean: should compile with 0 sorry ==="
          lake build Solution 2>&1 | tee /tmp/solution_output.txt
          # Filter: only check Solution.lean warnings, not upstream deps
          SOLUTION_LINES=$(grep -i "Solution.lean" /tmp/solution_output.txt || true)
          if echo "$SOLUTION_LINES" | grep -q "sorry"; then
            echo "❌ Solution.lean contains sorry!"
            exit 1
          fi
          if grep -q "^error:" /tmp/solution_output.txt; then
            echo "❌ Solution.lean build has errors!"
            exit 1
          fi
          if grep -q "build failed" /tmp/solution_output.txt; then
            echo "❌ Solution.lean build failed!"
            exit 1
          fi
          echo "✅ Solution.lean compiles clean — 0 sorry, 0 errors"

  comparator:
    name: Comparator Verification
    runs-on: ubuntu-latest
    timeout-minutes: 120
    needs: build
    defaults:
      run:
        working-directory: proofs

    steps:
      - uses: actions/checkout@v7

      - name: Install elan
        uses: leanprover/lean-action@v1
        with:
          build: false
          lake-package-directory: proofs

      - name: Cache Lake packages
        uses: actions/cache@v5
        with:
          path: |
            proofs/.lake/packages
            proofs/.lake/build
          key: lake-${{ hashFiles('proofs/lean-toolchain') }}-${{ hashFiles('proofs/lakefile.lean') }}-${{ hashFiles('proofs/lake-manifest.json') }}
          restore-keys: |
            lake-${{ hashFiles('proofs/lean-toolchain') }}-${{ hashFiles('proofs/lakefile.lean') }}-
            lake-${{ hashFiles('proofs/lean-toolchain') }}-

      - name: Build lean4export
        run: |
          TAG=$(sed -e 's/^leanprover\/lean4://' lean-toolchain | tr -d '[:space:]')
          echo "Cloning lean4export at tag: $TAG"
          git clone --branch "$TAG" --depth 1 https://github.com/leanprover/lean4export /tmp/lean4export || \
            git clone --depth 1 https://github.com/leanprover/lean4export /tmp/lean4export
          cd /tmp/lean4export
          lake build

      - name: Build Challenge and Solution targets
        run: |
          lake build Challenge Solution

      - name: Export and verify
        run: |
          echo "=== Cathedral Comparator: Export + Axiom Audit ==="

          # Export both modules
          lake env /tmp/lean4export/.lake/build/bin/lean4export Challenge > /tmp/challenge.export
          echo "✅ Challenge exported ($(wc -l < /tmp/challenge.export) lines)"

          lake env /tmp/lean4export/.lake/build/bin/lean4export Solution > /tmp/solution.export
          echo "✅ Solution exported ($(wc -l < /tmp/solution.export) lines)"

          # Verify theorem exists in both exports
          if ! grep -q "cathedral_main_theorem" /tmp/challenge.export; then
            echo "❌ cathedral_main_theorem not found in Challenge export"
            exit 1
          fi
          echo "✅ cathedral_main_theorem found in Challenge"

          if ! grep -q "cathedral_main_theorem" /tmp/solution.export; then
            echo "❌ cathedral_main_theorem not found in Solution export"
            exit 1
          fi
          echo "✅ cathedral_main_theorem found in Solution"

          # Report permitted axioms
          echo ""
          echo "=== Permitted axioms (comparator.json) ==="
          cat comparator.json
          echo ""
          echo "✅ Export verification complete"

      - name: Install Go (for landrun)
        uses: actions/setup-go@v6
        with:
          go-version: 'stable'

      - name: Install landrun
        run: |
          git clone --depth 1 https://github.com/Zouuup/landrun /tmp/landrun
          cd /tmp/landrun
          go build -o landrun ./cmd/landrun
          sudo cp landrun /usr/local/bin/
          echo "✅ landrun installed"

      - name: Add lean4export to PATH
        run: |
          sudo cp /tmp/lean4export/.lake/build/bin/lean4export /usr/local/bin/
          echo "✅ lean4export in PATH"

      - name: Clone and build comparator
        run: |
          TAG=$(sed -e 's/^leanprover\/lean4://' lean-toolchain | tr -d '[:space:]')
          echo "Cloning comparator at tag: $TAG"
          git clone --branch "$TAG" --depth 1 https://github.com/leanprover/comparator /tmp/comparator || \
            git clone --depth 1 https://github.com/leanprover/comparator /tmp/comparator
          cd /tmp/comparator
          lake build
          echo "✅ comparator built"

      - name: Run full comparator
        run: |
          echo "=== Running leanprover/comparator (full sandboxed) ==="
          lake env /tmp/comparator/.lake/build/bin/comparator comparator.json
          echo "✅ Full comparator verification passed"
