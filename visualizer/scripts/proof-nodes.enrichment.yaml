# This file provides human-written descriptions, LaTeX formulas,
# and proof step walkthroughs for key theorems. The generator
# merges this with auto-extracted data from Lean source files.
#
# To add a new curated node:
#   1. Add an entry below with a unique `key`
#   2. Run: python3 visualizer/scripts/generate_proof_nodes.py
#   3. The node appears in the Term Explorer automatically
# ═══════════════════════════════════════════════════════════════════

