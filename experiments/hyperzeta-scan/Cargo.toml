[package]
name = "hyperzeta-scan"
version = "0.1.0"
edition = "2021"
description = "Headless HyperZeta morphology scanner — sweeps t from 0→∞, computes shape/matter/jet statistics"

[dependencies]
rand = "0.8"
rand_chacha = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1.10"
clap = { version = "4", features = ["derive"] }

# Standalone crate — not part of the main workspace
[workspace]
