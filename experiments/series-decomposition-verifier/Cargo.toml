[package]
name = "series-decomposition-verifier"
version = "0.1.0"
edition = "2021"
description = """
Cathedral Series Decomposition Verifier — certifies the four-way
algebraic identity s_combined(M) = s_rational + s_log_stirling +
s_log_digamma + s_linear → vasyuninGramFormula(a,b) - strip(a,b)
as M→∞ by independent high-precision evaluation of each series
component and cross-verification against the formula value.
"""

[dependencies]
cathedral-utils = { path = "../cathedral-utils" }
rug = { version = "1.26", features = ["float"] }
rayon = "1.10"
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
