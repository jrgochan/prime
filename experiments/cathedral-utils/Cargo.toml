[package]
name = "cathedral-utils"
version = "0.1.0"
edition = "2021"
description = "Shared utilities for Cathedral numerical experiments"

[[bin]]
name = "gram-builder"
path = "src/bin/gram_builder.rs"

[[bin]]
name = "hpdf"
path = "src/bin/hpdf/main.rs"
required-features = ["hpdf"]

# Legacy binaries — kept for backward compatibility during migration
[[bin]]
name = "hpdf-verify"
path = "src/bin/hpdf_verify.rs"
required-features = ["hpdf"]

[[bin]]
name = "taper-analyzer"
path = "src/bin/taper_analyzer.rs"
required-features = ["hpdf"]

[features]
default = []
gpu = ["libc"]
hpdf = ["hdf5", "hdf5-sys", "ndarray"]

[dependencies]
# Pinned versions — all experiments must use these
nalgebra = "0.33"
rug = { version = "1.26", features = ["float"] }
rayon = "1.10"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
libc = { version = "0.2", optional = true }
hdf5 = { version = "0.8", optional = true }
hdf5-sys = { version = "0.8", features = ["static"], optional = true }
ndarray = { version = "0.15", optional = true }
sha2 = "0.10"

[lints]
workspace = true
