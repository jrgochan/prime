[package]
name = "character-spectral"
version = "0.1.0"
edition = "2024"
description = "Cathedral Character-Projected Spectral Probe — mod-8 residue class decomposition of the Gram matrix eigenvalue spectrum"

[[bin]]
name = "character-spectral"
path = "src/main.rs"

[[bin]]
name = "fast-probe"
path = "src/fast_probe.rs"

[[bin]]
name = "modulus-probe"
path = "src/modulus_probe.rs"

[[bin]]
name = "deep-probe"
path = "src/deep_probe.rs"

[[bin]]
name = "cert-export"
path = "src/cert_export.rs"

[[bin]]
name = "boson-fermion"
path = "src/boson_fermion.rs"

[[bin]]
name = "particle-sieve"
path = "src/particle_sieve.rs"

[[bin]]
name = "mersenne-probe"
path = "src/mersenne_probe.rs"

[dependencies]
cathedral-utils = { path = "../cathedral-utils" }
rug = "1.26"
rayon = "1.10"
chrono = "0.4"
nalgebra = "0.33"
