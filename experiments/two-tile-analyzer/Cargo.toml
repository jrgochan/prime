[package]
name = "two-tile-analyzer"
version = "0.1.0"
edition = "2024"
description = """Cathedral Two-Tile Correction Analyzer — 512-bit MPFR certified analysis of the
rowTerm formula error in two-tile rows. Discovers the correct unified formula and
certifies convergence bounds for the Lean proof of IntegralEqSCombined.lean."""

[dependencies]
cathedral-utils = { path = "../cathedral-utils" }
rug = "1.26"
rayon = "1.10"
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
