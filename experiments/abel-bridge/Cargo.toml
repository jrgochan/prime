[package]
name = "abel-bridge"
version = "0.2.0"
edition = "2021"
description = "Abel Summation Bridge: verify that rh_implies_mertens_bound → witness_l2_error_decay_gram"

[dependencies]
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "abel-bridge"
path = "src/main.rs"

[[bin]]
name = "toeplitz"
path = "src/toeplitz.rs"
