[package]
name = "cotangent-positivity"
version = "0.1.0"
edition = "2021"
description = "Deep probe: cotangent sum positivity at scale (N up to 50000)"

[[bin]]
name = "cotangent-positivity"
path = "src/main.rs"

[[bin]]
name = "gap-analysis"
path = "src/gap_analysis.rs"

[[bin]]
name = "f1-decomp"
path = "src/f1_decomp.rs"

[[bin]]
name = "overcancellation"
path = "src/overcancellation.rs"

[[bin]]
name = "path-1e-analytics"
path = "src/path_1e_analytics.rs"

[dependencies]
cathedral-utils = { path = "../cathedral-utils" }
rayon = "1.10"

[lints]
workspace = true
