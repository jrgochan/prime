[package]
name = "lambda-eff"
version = "0.1.0"
edition = "2021"
description = "High-N computation of λ_eff for the lambdaEff_linear_growth axiom"

[dependencies]
rayon = "1.8"
nalgebra = "0.33"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
indicatif = "0.17"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
