[package]
name = "vasyunin-integral-verifier"
version = "2.0.0"
edition = "2021"
description = """
Production-grade verification: G(j,k) = ∫₀¹ {1/(jx)}·{1/(kx)} dx
Exact piecewise FTC with 256-bit MPFR. Certified results with error bounds.
Cathedral Project — April 2026
"""

[dependencies]
cathedral-utils = { path = "../cathedral-utils" }
rug = { version = "1", features = ["float"] }
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"

[lints]
workspace = true
