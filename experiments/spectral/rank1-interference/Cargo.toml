[package]
name = "rank1-interference"
version = "0.1.0"
edition = "2024"

[dependencies]
nalgebra = "0.33"
rayon = "1"
serde_json = "1"
rug = "1"

[[bin]]
name = "eigenbasis"
path = "src/bin/eigenbasis.rs"

[[bin]]
name = "eigenbasis_mod8"
path = "src/bin/eigenbasis_mod8.rs"

[[bin]]
name = "highprec"
path = "src/bin/highprec.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

