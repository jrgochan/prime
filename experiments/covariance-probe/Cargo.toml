[package]
name = "covariance-probe"
version = "0.1.0"
edition = "2021"
description = "High-precision parallel probe of the Vasyunin covariance matrix — the discrete skeleton of the Riemann Hypothesis"

[dependencies]
rayon = "1.10"
nalgebra = "0.33"
clap = { version = "4", features = ["derive"] }
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
