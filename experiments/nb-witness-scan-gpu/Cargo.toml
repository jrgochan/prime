[package]
name = "nb-witness-scan-gpu"
version = "1.0.0"
edition = "2021"
description = "GPU-accelerated NB witness scan for large N (up to 120k+)"

[features]
default = []
gpu = ["cathedral-utils/gpu"]

[dependencies]
cathedral-utils = { path = "../cathedral-utils" }
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
