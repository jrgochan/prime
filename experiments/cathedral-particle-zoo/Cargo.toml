[package]
name = "cathedral-particle-zoo"
version = "2.0.0"
edition = "2021"
description = """
Cathedral Particle Zoo v2 — Map Standard Model particles to arithmetic
observables in Gram matrix H5 files using the Cathedral-Physics dictionary.

Incorporates: Gemini's Axion (Dirichlet characters), See-Saw neutrino masses
via Schur complement, coupling constants from operator traces, and Antigravity's
matrix-free RSVD bypass + liquid argon dark sector shield.
"""

[features]
default = ["hpdf"]
hpdf = ["cathedral-utils/hpdf", "hdf5", "hdf5-sys", "ndarray"]
gpu = ["cathedral-utils/gpu", "cathedral-utils/hpdf"]

[dependencies]
cathedral-utils = { path = "../cathedral-utils" }
rayon = "1.10"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hdf5 = { version = "0.8", optional = true }
hdf5-sys = { version = "0.8", features = ["static"], optional = true }
ndarray = { version = "0.15", optional = true }

[[bin]]
name = "cathedral-particle-zoo"
path = "src/main.rs"

[lints]
workspace = true
