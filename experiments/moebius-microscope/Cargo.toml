[package]
name = "moebius-microscope"
version = "2.0.0"
edition = "2021"
description = "Möbius Cancellation Microscope v2 — decompose vᵀGv by GCD, Rotor channel, Vaughan type, Liouville parity, and trace cancellation. Supports HPDF/DD precision."

[features]
default = []
hpdf = ["cathedral-utils/hpdf"]
gpu = ["cathedral-utils/gpu", "cathedral-utils/hpdf"]

[dependencies]
cathedral-utils = { path = "../cathedral-utils" }
rayon = "1.10"
nalgebra = "0.33"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }

[[bin]]
name = "moebius-microscope"
path = "src/main.rs"

[[bin]]
name = "octonion-probe"
path = "src/octonion.rs"

[[bin]]
name = "pointwise-eval"
path = "src/bin/pointwise_eval.rs"
