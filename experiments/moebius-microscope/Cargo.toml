[package]
name = "moebius-microscope"
version = "0.1.0"
edition = "2021"
description = "Möbius Cancellation Microscope — decompose vᵀGv by GCD, Rotor channel, Vaughan type, Liouville parity, and trace cancellation mechanisms"

[dependencies]
cathedral-utils = { path = "../cathedral-utils" }
rayon = "1.10"
nalgebra = "0.33"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "moebius-microscope"
path = "src/main.rs"

[[bin]]
name = "octonion-probe"
path = "src/octonion.rs"
